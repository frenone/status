owner: frenone
repo: status

# What is checked, every 5 minutes, from GitHub's runners.
# The Telegram and Discord agents have no public endpoint of their own:
# they depend on the API, so the API check stands for them.
sites:
  - name: Dashboard (app.fren.one)
    url: https://app.fren.one
  - name: API (api.fren.one)
    url: https://api.fren.one/health
  - name: Documentation (docs.fren.one)
    url: https://docs.fren.one
  - name: Website (fren.one)
    url: https://fren.one

status-website:
  cname: status.fren.one
  logoUrl: https://docs.fren.one/img/f1logo600x600.png
  name: Fren One Status
  introTitle: "**Fren One** service status"
  introMessage: Live availability and response times for the Fren One dashboard, API, documentation and website, checked every 5 minutes. Incidents are posted here as they happen. For what changed in each release, see the [changelog](https://docs.fren.one/changelog).
  navbar:
    - title: Status
      href: /
    - title: Changelog
      href: https://docs.fren.one/changelog
    - title: Docs
      href: https://docs.fren.one
    - title: Support
      href: https://docs.fren.one/docs/overview/support
